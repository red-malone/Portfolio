# Continuous Integration
# Runs on every push to `dev` and on every pull request into `main`.
# Branch protection on `main` requires the "build" job below to pass before a PR can merge,
# so a broken change can never reach the live (Vercel) site.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # reuse downloaded packages between runs

      # `npm ci` installs exactly what package-lock.json lists, failing if the lock file is out of sync.
      - name: Install dependencies
        run: npm ci

      # Fails if any production dependency has a known high/critical vulnerability.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      # Catches type errors (e.g. a typo'd field in data/cv.ts) with a clear message.
      - name: Type check
        run: npm run typecheck

      # Builds the static site into out/ — the same thing Vercel does.
      - name: Build
        run: npm run build

      # Checks the built HTML actually contains the expected content (see scripts/check-build.mjs).
      - name: Smoke test built site
        run: npm test
